[project]
site_name = "bited"
site_url = "https://benpa.ng/bited"
repo_url = "https://github.com/molarmanful/bited"
repo_name = "molarmanful/bited"
copyright = "Copyright &copy; 2024 The bited Project Authors"
extra_javascript = ["javascripts/mermaid.mjs"]

[project.plugins]
mike.canonical_version = "latest"
awesome-nav = {}
glightbox = {}

[project.extra]
version.provider = "mike"
version.alias = true

[project.markdown_extensions]
admonition = {}
pymdownx.details = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.keys = {}
pymdownx.blocks.caption = {}
attr_list = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
md_in_html = {}
def_list = {}

[project.theme]
logo = "assets/icon.svg"
favicon = "assets/favicon.ico"
features = [
  "content.code.copy",
  "navigation.instant",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.expand",
  # "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"
